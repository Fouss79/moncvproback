# ====================================
# APPLICATION
# ====================================
spring.application.name=moncvproback
server.port=${PORT:8080}

# ====================================
# DATABASE MYSQL
# ====================================


spring.jpa.open-in-view=true
# ====================================
# JPA / HIBERNATE
# ====================================

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true



# ====================================
# UPLOAD FILES (photo CV)
# ====================================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# dossier local upload
file.upload-dir=uploads/

# ====================================
# SECURITY (JWT secret)
# ====================================

# ====================================
# LOGS
# ====================================
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG
spring.web.resources.static-locations=file:uploads/
mistral.api.key=${MISTRAL_API_KEY}
mistral.api.url=https://api.mistral.ai/v1/chat/completions
mistral.api.model=mistral-small-latest
server.error.include-message=always
server.error.include-stacktrace=always
logging.level.org.springframework.web=DEBUG





spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}

spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

app.jwt.secret=${APP_JWT_SECRET}
app.jwt.expiration=${APP_JWT_EXPIRATION}
brevo.api.key=${BREVO_API_KEY}
brevo.sender.email=foussenytraore692@gmail.com
brevo.sender.name=MonCVPro
geniuspay.api.url=${GENIUSPAY_API_URL}
geniuspay.api.key=${GENIUSPAY_API_KEY}
geniuspay.api.secret=${GENIUSPAY_API_SECRET}
payment.success.url=${PAYMENT_SUCCESS_URL}
payment.error.url=${PAYMENT_ERROR_URL}
geniuspay.webhook.secret=${GENIUSPAY_WEBHOOK_SECRET}