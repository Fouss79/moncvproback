# ====================================
# APPLICATION
# ====================================
spring.application.name=moncvproback
server.port=${PORT:8080}

# ====================================
# DATABASE MYSQL
# ====================================
spring.datasource.url=jdbc:mysql://localhost:3306/moncvpro?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.open-in-view=true
# ====================================
# JPA / HIBERNATE
# ====================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect


# ====================================
# UPLOAD FILES (photo CV)
# ====================================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# dossier local upload
file.upload-dir=uploads/

# ====================================
# SECURITY (JWT secret)
# ====================================
app.jwt.secret=moncvpro_secret_key_change_me_123456

app.jwt.expiration=86400000

# ====================================
# LOGS
# ====================================
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG
spring.web.resources.static-locations=file:uploads/
