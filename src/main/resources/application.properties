# ====================================
# APPLICATION
# ====================================
spring.application.name=moncvproback
server.port=${PORT:8080}

# ====================================
# DATABASE MYSQL
# ====================================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/moncvpro?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.open-in-view=true
# ====================================
# JPA / HIBERNATE
# ====================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect


# ====================================
# UPLOAD FILES (photo CV)
# ====================================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# dossier local upload
file.upload-dir=${FILE_UPLOAD_DIR:uploads/}

# ====================================
# SECURITY (JWT secret)
# ====================================
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=${JWT_EXPIRATION:86400000}

# ====================================
# LOGS
# ====================================
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG
spring.web.resources.static-locations=file:uploads/

# ====================================
# BREVO (ex-Sendinblue)
# ====================================
brevo.api.key=${BREVO_API_KEY}
brevo.sender.email=${BREVO_SENDER_EMAIL}
brevo.sender.name=${BREVO_SENDER_NAME:MonCVPro}

# ====================================
# GENIUSPAY
# ====================================
geniuspay.api.url=${GENIUSPAY_API_URL:https://geniuspay.ci/api/v1/merchant/payments}
geniuspay.api.key=${GENIUSPAY_API_KEY}
geniuspay.webhook.secret=${GENIUSPAY_WEBHOOK_SECRET}
geniuspay.api.secret=${GENIUSPAY_API_SECRET}

payment.success.url=${PAYMENT_SUCCESS_URL:http://localhost:3000/payment/success}
payment.cancel.url=${PAYMENT_CANCEL_URL:http://localhost:3000/payment/cancel}
payment.error.url=${PAYMENT_ERROR_URL:http://localhost:3000/payment/error}

# ====================================
# MISTRAL AI
# ====================================
mistral.api.key=${MISTRAL_API_KEY}
mistral.api.url=${MISTRAL_API_URL:https://api.mistral.ai/v1/chat/completions}
mistral.api.model=${MISTRAL_API_MODEL:mistral-small-latest}

# ====================================
# ERRORS / DEBUG (à désactiver en prod)
# ====================================
server.error.include-message=always
server.error.include-stacktrace=always
logging.level.org.springframework.web=DEBUG